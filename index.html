<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redireccionando...</title>
</head>
<body>
    <script>
        (function() {
            var urlTally = "https://tally.so/r/q4QaK2"; 
            var ua = navigator.userAgent || navigator.vendor || window.opera;
            
            var isAndroid = /android/i.test(ua);
            var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;

            if (isAndroid) {
                // 1. Limpiamos la URL quitando el protocolo 'https://'
                var cleanUrl = urlTally.replace(/^https?:\/\//, '');
                
                // 2. Construimos el Intent específico del paquete oficial de Chrome
                var chromeIntent = "intent://" + cleanUrl + "#Intent;scheme=https;package=com.android.chrome;end";
                
                // 3. Forzamos la apertura de la App de Chrome de raíz
                window.location.replace(chromeIntent);
            } 
            else if (isIOS) {
                // 1. Codificamos la URL para cumplir con los estándares de Apple
                var encodedUrl = encodeURIComponent(urlTally);
                
                // 2. Usamos el protocolo interno del sistema iOS que obliga a Safari a abrir la URL
                var safariIntent = "x-web-search://?site=" + encodedUrl;
                
                // 3. Forzamos la apertura de la App de Safari de raíz
                window.location.replace(safariIntent);
            } 
            else {
                // Si están en una PC o cualquier otro sistema operativo, va directo
                window.location.replace(urlTally);
            }
        })();
    </script>
</body>
</html>
