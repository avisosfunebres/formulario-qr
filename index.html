<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abriendo...</title>
</head>
<body>
    <script>
        (function() {
            var urlTally = "https://tally.so/r/q4QaK2"; 
            var ua = navigator.userAgent || navigator.vendor || window.opera;

            // 1. DETECCIÓN ULTRA AGRESIVA (Resiste Modo PC)
            // Si dice Android en el texto, o si tiene pantalla táctil extrema simulando ser Linux/Mac
            var isAndroid = /android/i.test(ua) || 
                            (/Linux/i.test(ua) && navigator.maxTouchPoints > 1) || 
                            (navigator.platform === 'Linux armv8l' && navigator.maxTouchPoints > 1);
            
            // Si dice iPhone, o si simula ser una Mac de escritorio pero tiene pantalla táctil (iOS en Modo PC)
            var isIOS = /iPad|iPhone|iPod/.test(ua) || 
                        (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);

            // 2. DISPARADORES DE PROTOCOLO BINARIO
            if (isAndroid) {
                var cleanUrl = urlTally.replace(/^https?:\/\//, '');
                
                // INTENT PRINCIPAL: Fuerza el paquete de Chrome
                var chromeIntent = "intent://" + cleanUrl + "#Intent;scheme=https;package=com.android.chrome;end";
                
                // INTENT SECUNDARIO (Por si el motor PC bloquea el reemplazo de ubicación directo)
                window.location.replace(chromeIntent);
                
                // Respaldo de fuerza bruta por si la pestaña PC congela el script
                setTimeout(function() {
                    window.location.href = chromeIntent;
                }, 100);
            } 
            else if (isIOS) {
                var encodedUrl = encodeURIComponent(urlTally);
                var safariIntent = "x-web-search://?site=" + encodedUrl;
                
                window.location.replace(safariIntent);
                
                setTimeout(function() {
                    window.location.href = safariIntent;
                }, 100);
            } 
            else {
                // Si realmente es una computadora de escritorio real
                window.location.replace(urlTally);
            }
        })();
    </script>
</body>
</html>
